[package]
name = "nove-work"
version = "0.1.0"
description = "Novel Work — constrained AI novel writing tool"
authors = ["Novel Work"]
edition = "2021"

[lib]
name = "nove_work_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "blocking", "gzip"] }
anyhow = "1"
parking_lot = "0.12"
dirs = "6"
rig-core = { version = "0.42", features = ["derive"] }
rig-agent = "0.42"
rig-lancedb = "0.42"
rig-sqlite = "0.42"
rig-memory = "0.42"
schemars = "1"
rmcp = { version = "3.1", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
  "client",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = { version = "0.7", features = ["rt"] }
lancedb = { version = "0.30", default-features = false }
futures = "0.3"
arrow-array = "58"
arrow-schema = "58"
sqlite-vec = "0.1"
tokio-rusqlite = { version = "0.6", default-features = false, features = ["bundled"] }
aes-gcm = "0.11.0"
sha2 = "0.11.0"
getrandom = "0.4.3"
hex = "0.4.3"
hostname = "0.4.2"
whoami = "2.1.2"
epub = "2.1.5"
once_cell = "1"
fastembed = "5"
# crates.io 版写死 CUDA EP，与当前 ort 不兼容；本地副本走 CPU。
kokoro-tts = { path = "vendor/kokoro-tts" }
voxudio = { version = "0.6.3", features = ["device"] }
