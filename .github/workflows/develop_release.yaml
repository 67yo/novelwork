# Develop 构建：macOS DMG（Apple Silicon + Intel）+ Windows NSIS
#
# 产出：
#   Apple Silicon  src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
#   Intel          src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
#   Windows        src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
#
# crates.io 只在 cargo-fetch 拉一次，.crate 缓存跨 Apple Silicon / Intel / Windows 复用。
# 编译产物仍按架构分缓存。安装包不进缓存，避免撑破仓库 10GB 上限。

name: develop-release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "1"
  CARGO_PROFILE_RELEASE_INCREMENTAL: "true"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  cargo-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache crates.io downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-dl-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-dl-
          enableCrossOsArchive: true

      - name: Fetch crates
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

  build:
    needs: cargo-fetch
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-apple-silicon
            rust_target: aarch64-apple-darwin
            bundles: dmg
            artifact: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          # - os: macos-latest
          #   name: macos-intel
          #   rust_target: x86_64-apple-darwin
          #   bundles: dmg
          #   artifact: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: develop-release-${{ matrix.name }}
          cache-on-failure: true

      # rust-cache 按架构分开，crates.io 的 .crate 用同一把 key 从 cargo-fetch 回填。
      - name: Restore crates.io downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-dl-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-dl-
          enableCrossOsArchive: true

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --target ${{ matrix.rust_target }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Novel-Work-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      # rust-cache 的 post 在全部 step 之后才写入。先丢掉安装包和最终二进制，
      # 只留下 deps/build，下次命中后只重链本 crate。
      - name: Trim target before rust-cache save
        if: always()
        shell: bash
        run: |
          rel="src-tauri/target/${{ matrix.rust_target }}/release"
          rm -rf "$rel/bundle" "$rel/nsis" "$rel/wix" "$rel/macos" "$rel/dmg" "$rel/incremental"
          rm -f "$rel"/nove-work "$rel"/nove-work.exe "$rel"/nove-work.pdb \
            "$rel"/nove_work.pdb "$rel"/libnove_work.* "$rel"/*.d
          rm -rf src-tauri/target/debug src-tauri/target/release
